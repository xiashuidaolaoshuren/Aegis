name: CI

on:
  push:
    branches:
      - main
      - 'features/**'
  pull_request:
    branches:
      - main

jobs:
  linux-clang:
    name: linux-clang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Setup vcpkg
        run: |
          if [ -d /usr/local/share/vcpkg ]; then
            VCPKG_ROOT=/usr/local/share/vcpkg
          else
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
            VCPKG_ROOT="$HOME/vcpkg"
          fi
          if [ ! -x "$VCPKG_ROOT/vcpkg" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"

      - name: Cache vcpkg archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ hashFiles('vcpkg.json') }}-linux-clang-${{ runner.os }}
          restore-keys: |
            vcpkg-${{ hashFiles('vcpkg.json') }}-
            vcpkg-

      - name: Configure
        run: cmake --preset linux-clang

      - name: Build
        run: cmake --build --preset linux-clang

      - name: Test
        run: ctest --preset linux-clang --output-on-failure

  linux-clang-asan:
    name: linux-clang-asan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Setup vcpkg
        run: |
          if [ -d /usr/local/share/vcpkg ]; then
            VCPKG_ROOT=/usr/local/share/vcpkg
          else
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
            VCPKG_ROOT="$HOME/vcpkg"
          fi
          if [ ! -x "$VCPKG_ROOT/vcpkg" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"

      - name: Cache vcpkg archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ hashFiles('vcpkg.json') }}-linux-clang-asan-${{ runner.os }}
          restore-keys: |
            vcpkg-${{ hashFiles('vcpkg.json') }}-
            vcpkg-

      - name: Configure
        run: cmake --preset linux-clang-asan

      - name: Build
        run: cmake --build --preset linux-clang-asan

      - name: Test
        run: ctest --preset linux-clang-asan --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
